name: Build macOS app

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - feature/develop
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-macos-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Build EUB Changes.app
        run: ./scripts/BuildDesktopMac.sh

      - name: Package app bundle
        run: ditto -c -k --keepParent "dist/EUB Changes.app" "dist/EUB-Changes-macOS-arm64.zip"

      - name: Upload macOS app
        uses: actions/upload-artifact@v6
        with:
          name: EUB-Changes-macOS-arm64
          path: dist/EUB-Changes-macOS-arm64.zip
          if-no-files-found: error
